name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Version
        id: version
        run: |
          VER=$(cat VERSION 2>/dev/null | tr -d '\r\n' || echo "1.2.0")
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Make Build Script Executable
        run: chmod +x build-appimage.sh

      - name: Build AppImage
        run: ./build-appimage.sh

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-${{ env.VERSION }}-x86_64.AppImage
          path: MusicDownloader-${{ env.VERSION }}-x86_64.AppImage

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 requests mutagen yt-dlp

      - name: Read Version
        id: version
        shell: bash
        run: |
          VER=$(cat VERSION 2>/dev/null | tr -d '\r\n' || echo "1.2.0")
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Build Windows Executable
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "MusicDownloader" \
            --add-data "src;src" \
            src/main.py

      - name: Download ffmpeg for Windows
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n6.1-latest-win64-gpl-6.1.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "."
          $ffmpegBin = Get-ChildItem -Path . -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffmpegBin.FullName -Destination "dist/MusicDownloader/"

      - name: Download fpcalc (chromaprint) for Windows
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip" -OutFile "fpcalc.zip"
          Expand-Archive -Path "fpcalc.zip" -DestinationPath "."
          $fpcalcBin = Get-ChildItem -Path . -Filter "fpcalc.exe" -Recurse | Select-Object -First 1
          Copy-Item $fpcalcBin.FullName -Destination "dist/MusicDownloader/"

      - name: Create Zip Archive
        shell: powershell
        run: |
          Compress-Archive -Path "dist/MusicDownloader/*" -DestinationPath "MusicDownloader-${{ env.VERSION }}-windows-x64.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-${{ env.VERSION }}-windows-x64.zip
          path: MusicDownloader-${{ env.VERSION }}-windows-x64.zip

  release:
    name: Create GitHub Release
    needs: [build-linux-appimage, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}