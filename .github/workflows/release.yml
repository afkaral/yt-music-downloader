name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Version
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-${{ env.VERSION }}-x86_64.AppImage
          path: MusicDownloader-${{ env.VERSION }}-x86_64.AppImage

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set PySide6 requests mutagen yt-dlp

      - name: Read Version
        shell: bash
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Build Windows Executable with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --windows-console-mode=disable \
            --enable-plugin=pyside6 \
            --include-data-dir=assets=assets \
            --output-dir=dist \
            --output-filename=MusicDownloader.exe \
            src/main.py

      - name: Download ffmpeg and ffprobe for Windows
        shell: powershell
        run: |
          curl.exe -L --fail --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 `
            -o ffmpeg.zip `
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg download failed." }

          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extracted"

          foreach ($name in "ffmpeg.exe", "ffprobe.exe") {
            $bin = Get-ChildItem -Path "ffmpeg-extracted" -Filter $name -Recurse | Select-Object -First 1
            if (-not $bin) { throw "$name was not found after extraction." }
            Copy-Item $bin.FullName -Destination "dist/main.dist/$name"
          }

      - name: Download fpcalc for Windows
        shell: powershell
        run: |
          curl.exe -L --fail --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 `
            -o fpcalc.zip `
            "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip"
          if ($LASTEXITCODE -ne 0) { throw "fpcalc download failed." }

          Expand-Archive -Path "fpcalc.zip" -DestinationPath "fpcalc-extracted"

          $bin = Get-ChildItem -Path "fpcalc-extracted" -Filter "fpcalc.exe" -Recurse | Select-Object -First 1
          if (-not $bin) { throw "fpcalc.exe was not found after extraction." }
          Copy-Item $bin.FullName -Destination "dist/main.dist/fpcalc.exe"

      - name: Download yt-dlp for Windows
        shell: powershell
        run: |
          curl.exe -L --fail --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 `
            -o "dist/main.dist/yt-dlp.exe" `
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp download failed." }

      - name: Smoke test
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist/main.dist/MusicDownloader.exe" -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Create Zip Archive
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist/main.dist/*" `
            -DestinationPath "MusicDownloader-${{ env.VERSION }}-windows-x64.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-${{ env.VERSION }}-windows-x64.zip
          path: MusicDownloader-${{ env.VERSION }}-windows-x64.zip

  release:
    name: Create GitHub Release
    needs:
      - build-linux-appimage
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}