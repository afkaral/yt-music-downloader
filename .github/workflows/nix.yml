name: "Nix Build"
on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Build flake
        run: nix build ./packaging/nix --no-write-lock-file --print-build-logs

      - name: Smoke test
        run: ./result/bin/music-downloader --version