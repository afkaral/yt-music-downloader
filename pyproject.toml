[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-music-downloader"
dynamic = ["version"]
description = "YouTube and SoundCloud music download via yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "afkaral" }
]
keywords = ["youtube", "soundcloud", "downloader", "music", "tagger", "acoustid", "musicbrainz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "mutagen>=1.46.0",
    "yt-dlp>=2023.3.4",
]

[project.scripts]
yt-music-downloader = "src.main:main"

[project.urls]
Homepage = "https://github.com/afkaral/yt-music-downloader"
Repository = "https://github.com/afkaral/yt-music-downloader"
Issues = "https://github.com/afkaral/yt-music-downloader/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
"*" = ["assets/*"]